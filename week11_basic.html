<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Mini Mario</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 2px solid black;
            background: skyblue;
        }
    </style>
</head>

<body>
    <h1>Mini Mario</h1>
    <p>점수: <span id="score">0</span> | 목숨: <span id="life">3</span></p>
    <p>조작: ← / → 이동, Space 점프</p>
    <canvas id="gameCanvas" width="700" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("score");
        const lifeText = document.getElementById("life");

        let score = 0;
        let life = 3;
        let gameOver = false;
        let gameClear = false;
        const gravity = 0.6;

        const platforms = [
            { x: 0, y: 360, width: 700, height: 40 },
            { x: 140, y: 270, width: 120, height: 20 },
            { x: 320, y: 230, width: 150, height: 20 },
            { x: 500, y: 170, width: 120, height: 20 }
        ];

        function drawPlatforms() {
            ctx.fillStyle = "brown";
            for (let platform of platforms) {
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            }
        }

        const coins = [
            { x: 195, y: 240, radius: 10, collected: false },
            { x: 395, y: 200, radius: 10, collected: false },
            { x: 560, y: 140, radius: 10, collected: false }
        ];

        function drawCoins() {
            for (let coin of coins) {
                if (coin.collected) continue;
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                ctx.fillStyle = "gold";
                ctx.fill();
            }
        }

        const goal = {
            x: 650, y: 300, width: 30, height: 60
        };

        function drawGoal() {
            ctx.fillStyle = "green";
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
            ctx.fillStyle = "white";
            ctx.fillRect(goal.x + 5, goal.y + 10, 20, 15);
        }

        const player = {
            x: 50, y: 300, width: 35, height: 45,
            dx: 0, dy: 0, speed: 5, jumpPower: -13,
            onGround: false
        };

        function drawPlayer() {
            ctx.fillStyle = "red";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "blue";
            ctx.fillRect(player.x, player.y + 20, player.width, 25);
            ctx.fillStyle = "white";
            ctx.fillRect(player.x + 8, player.y + 8, 6, 6);
            ctx.fillRect(player.x + 22, player.y + 8, 6, 6);
        }

        const keys = {};

        document.addEventListener("keydown", function (event) {
            keys[event.code] = true;
            if (event.code === "Space" && player.onGround) {
                player.dy = player.jumpPower;
                player.onGround = false;
            }
        });

        document.addEventListener("keyup", function (event) {
            keys[event.code] = false;
        });

        function movePlayer() {
            player.dx = 0;
            if (keys["ArrowLeft"]) {
                player.dx = -player.speed;
            }
            if (keys["ArrowRight"]) {
                player.dx = player.speed;
            }

            player.x += player.dx;

            // 화면 좌우 이탈 방지
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.dy += gravity;
            player.y += player.dy;

            player.onGround = false;
            for (let platform of platforms) {
                if (
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y + player.height >= platform.y &&
                    player.y + player.height - player.dy <= platform.y + 10 &&
                    player.dy >= 0
                ) {
                    player.y = platform.y - player.height;
                    player.dy = 0;
                    player.onGround = true;
                }
            }
        }

        function checkCoinCollision() {
            for (let coin of coins) {
                if (coin.collected) continue;
                const playerCenterX = player.x + player.width / 2;
                const playerCenterY = player.y + player.height / 2;

                const dx = playerCenterX - coin.x;
                const dy = playerCenterY - coin.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < coin.radius + player.width / 2) {
                    coin.collected = true;
                    score++;
                    scoreText.textContent = score;
                }
            }
        }

        function checkGoalCollision() {
            if (
                player.x < goal.x + goal.width &&
                player.x + player.width > goal.x &&
                player.y < goal.y + goal.height &&
                player.y + player.height > goal.y
            ) {
                clearGame();
            }
        }

        function clearGame() {
            gameClear = true;
            drawMessage("게임 완료");
        }

        function endGame() {
            gameOver = true;
            drawMessage("게임 오버");
        }

        const enemies = [
            { x: 250, y: 330, width: 35, height: 30, dx: 2, minX: 150, maxX: 400, alive: true },
            { x: 350, y: 200, width: 35, height: 30, dx: 1.5, minX: 320, maxX: 470, alive: true }
        ];

        function drawEnemies() {
            for (let enemy of enemies) {
                if (!enemy.alive) continue;
                ctx.fillStyle = "purple";
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                ctx.fillStyle = "white";
                ctx.fillRect(enemy.x + 7, enemy.y + 8, 6, 6);
                ctx.fillRect(enemy.x + 22, enemy.y + 8, 6, 6);
            }
        }

        function moveEnemies() {
            for (let enemy of enemies) {
                if (!enemy.alive) continue;
                enemy.x += enemy.dx;
                if (enemy.x < enemy.minX || enemy.x + enemy.width > enemy.maxX) {
                    enemy.dx *= -1;
                }
            }
        }

        function checkEnemyCollision() {
            for (let enemy of enemies) {
                if (!enemy.alive) continue;
                const isHit =
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y;

                if (isHit) {
                    const playerBottom = player.y + player.height;
                    const enemyTop = enemy.y;

                    if (player.dy > 0 && playerBottom - enemyTop < 20) {
                        enemy.alive = false;
                        player.dy = -8;
                        score += 2;
                        scoreText.textContent = score;
                    } else {
                        life--;
                        lifeText.textContent = life;
                        resetPlayer();
                        if (life <= 0) {
                            endGame();
                        }
                    }
                }
            }
        }

        function resetPlayer() {
            player.x = 50;
            player.y = 300;
            player.dx = 0;
            player.dy = 0;
        }

        function drawMessage(message) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "bold 36px Arial";
            ctx.textAlign = "center";
            ctx.fillText(message, canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = "24px Arial";
            ctx.fillText("점수: " + score, canvas.width / 2, canvas.height / 2 + 30);
        }

        function gameLoop() {
            if (gameOver || gameClear) {
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            movePlayer();
            moveEnemies();

            checkCoinCollision();
            checkEnemyCollision();

            drawPlatforms();
            drawCoins();
            drawEnemies();
            drawPlayer();

            if(score >= 7){
                drawGoal();
                checkGoalCollision();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>

</html>
