<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>슈팅게임</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #111;
        }
    </style>
</head>

<body>
    <h1>Space Shooter</h1>
    <p>점수: <span id="score">0</span> | 생명: <span id="life">3</span></p>
    <p>조작: ← / → 이동, Space 발사, Shift: 감속</p>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        const lifeText = document.getElementById("life");

        let gameOver = false;
        let life = 3;
        let score = 0;

        const shotDelay = 150;
        let lastShoot = 0;

        const player = {
            x: 280,
            y: 340,
            width: 40,
            height: 40,
            speed: 6
        }

        function drawPlayer() {
            ctx.fillStyle = "deepskyblue";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = "white";
            ctx.fillRect(player.x+15, player.y-15, 10, 10);
        }

        const keys = {};
        const bullets = [];

        document.addEventListener("keydown", function(event){
            keys[event.code] = true;
        });

        document.addEventListener("keyup", function(event){
            keys[event.code] = false;
        });

        function movePlayer(){
            if(keys["ArrowLeft"]){
                player.x -= player.speed;
            }
            if(keys["ArrowRight"]){
                player.x += player.speed;
            }
            if(player.x < 0){
                player.x  = 0;
            }
            if(player.x+player.width > canvas.width){
                player.x = canvas.width - player.width;
            }
        }

        function shootBullet(){
            bullets.push({
                x: player.x + player.width/2 - 3,
                y: player.y,
                width:6,
                height: 12,
                speed: 7
            });
        }

        function drawBullets(){
            ctx.fillStyle = "yellow";

            for(let bullet of bullets){
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            }
        }

        function moveBullets(){
            for(let bullet of bullets){
                bullet.y -= bullet.speed;
            }

            for(let i = bullets.length-1; i>=0; i--){
                if(bullets[i].y + bullets[i].height < 0){
                    bullets.splice(i, 1);
                }
            }
        }

        const enemies = [];

        function createEnemy(){

            const heal = Math.random() < 0.3;

            enemies.push({
                x: Math.random() * (canvas.width - 40),
                y: -40,
                width:40,
                height: 40,
                speed: Math.random() * 2+2,
                type: heal ? "AID" : "NONE"
            });
        }

        function drawEnemies(){
            for (let enemy of enemies) {
                if (enemy.type === "AID") {
                    ctx.fillStyle = "limegreen";
                } else {
                    ctx.fillStyle = "crimson";
                }
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                
            }
        }

        function moveEnemies(){
            for(let enemy of enemies){
                enemy.y += enemy.speed;
            }

            for(let i = enemies.length-1; i>=0; i--){
                if(enemies[i].y > canvas.height){

                    life--;
                    lifeText.textContent = life;

                    if(life <= 0) {
                        endGame();
                    }

                    enemies.splice(i, 1);
                }
            }
        }

        function checkBulletEnemyCollision() {
            for(let i = enemies.length-1; i >= 0; i--){
                for(let j = bullets.length-1; j >= 0; j--){
                    const bullet = bullets[j];
                    const enemy = enemies[i];

                    if(bullet.x < enemy.x+ enemy.width &&
                    bullet.x + bullet.width > enemy.x &&
                    bullet.y < enemy.y + enemy.height &&
                    bullet.y + bullet.height > enemy.y){

                        if(enemy.type === "AID"){
                            life++;
                            lifeText.textContent = life;
                        }
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);

                        score++;
                        scoreText.textContent = score;
                        break;
                    }
                }
            }
        }

        function checkPlayerEnemyCollision(){
            for(let i =enemies.length-1; i>=0; i--){
                const enemy = enemies[i];
                if (player.x < enemy.x+ enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y)
                    {

                    if(enemy.type === "AID"){
                            life++;
                            lifeText.textContent = life;
                    }
                    else{
                        life--;
                    lifeText.textContent = life;
                    if(life <= 0) {
                        endGame();
                    }
                    }
                    enemies.splice(i, 1);
                }
            }
        }
        function findSpaceIn(){
            if (keys["Space"]){
                const realTime = Date.now();
                if(realTime - lastShoot > shotDelay){
                    shootBullet();
                    lastShoot = realTime;
                }
            }
        }

        function changePlayerSpeed(){
            if (keys["ShiftLeft"] || keys["ShiftRight"]){
                    player.speed = 3;
            }
            else{
                player.speed = 6;
            }
        }

        function endGame(){
            gameOver = true;

            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0,0, canvas.width, canvas.height);

            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.fillText("게임 오버", canvas.width / 2, canvas.height/2 - 30);
            ctx.fillText("점수: " + score, canvas.width / 2, canvas.height/2 + 30);
        }

        function gameLoop() {
            if (gameOver) {
                return;
            }
            ctx.clearRect(0,0,canvas.width,canvas.height);
            movePlayer();
            moveBullets();
            moveEnemies();
            drawBullets();
            drawPlayer();
            drawEnemies();
            changePlayerSpeed();
            findSpaceIn();
            checkBulletEnemyCollision();
            checkPlayerEnemyCollision();
            requestAnimationFrame(gameLoop);
        }
        setInterval(createEnemy, 900);
        gameLoop();
    </script>
</body>

</html>
