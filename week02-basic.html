<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>두더지 잡기</title>

<style>
body {
    text-align: center;
    font-family: Arial;
}

canvas {
    border: 2px solid black;
}
</style>

</head>
<body>

<h1>두더지 잡기</h1>

<p>
점수 :
<span id="score">0</span> | 남은 시간 : <span id="time">30</span>초
<button onclick="startGame()">게임 시작</button>
</p>

<canvas id="gameCanvas"
        width="600"
        height="400">
</canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");

    let moleX = 300;
    let moleY = 200;
    let moleRadius = 30;

    let score = 0;

    let timeLeft = 30;
    let gameRunning = false;
    let moleSpeed = 1000;
    let timerId;
    let moleMoveId;

    function startGame() {
        score = 0;
        timeLeft = 30;
        gameRunning = true;

        scoreText.textContent = score;
        timeText.textContent = timeLeft;

        clearInterval(timerId);
        clearInterval(moleMoveId);

        moveMole();
        timerId = setInterval(() => {
            timeLeft--;
            timeText.textContent = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
        moleMoveId = setInterval(moveMole, moleSpeed);
    }

    function endGame(){
        gameRunning = false;
        clearInterval(timerId);
        clearInterval(moleMoveId);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '32px Arial';
        ctx.fillStyle = "black";
        ctx.textAlign = "center";
        ctx.fillText("게임 종료", canvas.width/2, 100);
        ctx.fillText("최종 점수: " + score + "점", canvas.width/2, 230);
    }


    function drawMole(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.arc(moleX, moleY, moleRadius, 0, Math.PI * 2);
        if (score % 5 == 0 && score > 0) {
            ctx.fillStyle = "blue";
        }else{
            ctx.fillStyle = "brown";
        }
        ctx.fill();
    }
    // drawMole();

    function moveMole(){
        moleX = Math.random() * (canvas.width - 80) + 40;
        moleY = Math.random() * (canvas.height - 80) + 40;
        drawMole();
    }
    // setInterval(moveMole, 1000);

    canvas.addEventListener("click", function(event){
        const rect = canvas.getBoundingClientRect();
        // alert(rect.left);
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;

        const dx = mouseX - moleX;
        const dy = mouseY - moleY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if(distance <= moleRadius) {
            if (score % 5 == 0 && score > 0) {
            timeLeft = timeLeft + 3;
            timeText.textContent = timeLeft;
            }
            score++;
            document.getElementById("score").textContent = score;
            moveMole();
        }else{
            score--;
            document.getElementById("score").textContent = score;
        }
    });
</script>

</body>
</html>
