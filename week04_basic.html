<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Pong 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #f5f5f5;
        }

        canvas {
            border: 2px solid black;
            background: #111;
        }
    </style>
</head>

<body>

    <h1>Pong 게임</h1>
    <p>왼쪽 플레이어: W / S | 오른쪽 플레이어: ↑ / ↓</p>
    <p>왼쪽 점수: <span id="leftScore">0</span> | 오른쪽 점수: <span id="rightScore">0</span></p>
    <button onclick="startGame()">시작</button>

    <canvas id="gameCanvas" width="700" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const leftScoreText = document.getElementById("leftScore");
        const rightScoreText = document.getElementById("rightScore");


        let leftScore = 0;
        let rightScore = 0;
        let gameRunning = false;
        let gameId;


        function startGame(){
            gameRunning = true;
            ctx.clearRect(0,0, canvas.width, canvas.height);
            clearInterval(leftScore);
            clearInterval(rightScore);
            if (gameId) {
                cancelAnimationFrame(gameId);
            }
            
            leftScore = 0;
            rightScore = 0;
            rightScoreText.textContent = rightScore;
            leftScoreText.textContent = leftScore;
            drawGame();
        }

        function drawCenterLine(){
            ctx.setLineDash([10,10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.strokeStyle = "white";
            ctx.stroke();
            ctx.setLineDash([]);

        }

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            dx: 5,
            dy: 3
        }

        function drawBall(){
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
        }

        
        function moveBall(){
            ball.x += ball.dx;
            ball.y += ball.dy;

            if(ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height){
                ball.dy *= -1;
            }

            if(gameRunning){
            if (ball.x - ball.radius < 0) {
                rightScore++;
                rightScoreText.textContent = rightScore;
                resetBall();
                
            }
            if (ball.x + ball.radius > canvas.width) {
                leftScore++;
                leftScoreText.textContent = leftScore;
                resetBall();
            }    
            }
            

            if(isBallHitPaddle(leftPaddle)){
                ball.dx = Math.abs(ball.dx);
            }
            if(isBallHitPaddle(rightPaddle)){
                ball.dx = -Math.abs(ball.dx);
            }
        }

        function isBallHitPaddle(paddle){
            return(
                ball.x - ball.radius < paddle.x + paddle.width &&
                ball.x + ball.radius > paddle.x &&
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.y + ball.radius > paddle.y
            );
        }

        const keys = {};

        document.addEventListener("keydown", function(event){
            keys[event.key] = true;
        });
        document.addEventListener("keyup", function(event){
            keys[event.key] = false;
        });

        function movePaddles(){
            if (keys["w"] || keys["W"]) {
                leftPaddle.y  -= leftPaddle.speed;
            }
            if (keys["s"] || keys["S"]) {
                leftPaddle.y  += leftPaddle.speed;
            }
            // if (keys["ArrowUp"]) {
            //     rightPaddle.y  -= rightPaddle.speed;
            // }
            // if (keys["ArrowDown"]) {
            //     rightPaddle.y  += rightPaddle.speed;
            // }
            keepPaddleInside(leftPaddle);
            // keepPaddleInside(rightPaddle);
        }

        function keepPaddleInside(paddle){
            if(paddle.y < 0){
                paddle.y = 0;
            }
            if(paddle.y + paddle.height > canvas.height){
                paddle.y = canvas.height - paddle.height;
            }
        }

        function resetBall(){
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx *= -1;
            ball.dy = Math.random() *6 -3;
            if (ball.dy === 0) {
                ball.dy = 2;
            }
        }

        const paddleWidth = 12;
        const paddleHeight = 80;

        const leftPaddle = {
            x:30,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            speed: 6
        }

        const rightPaddle = {
            x:canvas.width - 30 - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            speed: 6
        }

        function drawRect(rect){
            ctx.fillStyle = "white";
        ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
        }

        function moveAI(){
            const aiCenter = rightPaddle.y + rightPaddle.height/2;
            const speed = 2;

            if (ball.y < aiCenter) {
                rightPaddle.y -= speed;
            }
            else{
                rightPaddle.y += speed;
            }
            keepPaddleInside(rightPaddle);
        }

        function finishGame(){
                gameRunning = false;

                ctx.clearRect(0,0, canvas.width, canvas.height);
                clearInterval(leftScore);
                clearInterval(rightScore);
                if (gameId) {
                cancelAnimationFrame(gameId);
                }
            

            if (leftScore > 2) {
                ctx.clearRect(0,0, canvas.width, canvas.height);
                ctx.font = "32px Arial";
                ctx.fillStyle = "black";
                ctx.textAlign = "center";
                ctx.fillText("플레이어 승리", canvas.width / 2, canvas.height / 2);
            }

            if (rightScore > 2) {
                ctx.clearRect(0,0, canvas.width, canvas.height);
                ctx.font = "32px Arial";
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.fillText("AI 승리", canvas.width / 2, canvas.height / 2);
            }
        }

        function drawGame(){
    
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawCenterLine();
            moveBall();
            drawBall();
            movePaddles();
            drawRect(leftPaddle);
            drawRect(rightPaddle);
            moveAI();
            if (leftScore > 2 || rightScore > 2) {
                finishGame();
            }
            gameId = requestAnimationFrame(drawGame);
        }
    </script>
</body>

</html>
